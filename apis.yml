aid: fairmatic
name: Fairmatic
description: >-
  Fairmatic was a San Francisco commercial-auto insurance MGA founded in 2017 that underwrote and
  priced fleet policies from phone-collected telematics. It rebranded to LEEO Insurance Services on
  2025-12-15, and every Fairmatic-branded web surface now 301/302 redirects to leeoinsurance.com:
  fairmatic.com and www.fairmatic.com to leeoinsurance.com, docs.fairmatic.com to
  docs.leeoinsurance.com, app.fairmatic.com to app.leeoinsurance.com. The old API host
  api.fairmatic.com returns 404 at its root; the live REST Fleet Telematics API is served from
  api.leeoinsurance.com/api/v1. This repository is therefore a DUPLICATE STUB, created by the
  harvest backlog from a secondary-market share-listing page rather than from the company's own
  domain. The canonical, fully enriched profile of this company is all/leeo-insurance-services,
  which already carries the four OpenAPIs, the authentication, conventions, error, lifecycle,
  changelog, conformance, data-model, MCP, llms.txt, skills, agentic-access and domain-security
  artifacts, and the complete Fairmatic-branded SDK line (npm, Maven Central, NuGet, CocoaPods).
  No artifacts are wired here on purpose: duplicating them would split one company across two
  listings and two Kin Scores.
